[Render]
TestMode=0
; SubmitMode:
;   0 = VR_STEREO_3D (Normalna polaryzacja oczu)
;   1 = VR_STEREO_SWAP (Odwrocona polaryzacja oczu - potwierdzona jako najlepsza w tescie)
;   2 = QUAD_WORLD_ANCHOR (Kotwiczony w pokoju klasyczny ekran kinowy)
;   3 = QUAD_HEAD_LOCKED (Ekran kinowy podazajacy za glowa)
SubmitMode=1

; TrackingSubMode (F9 przelacza na zywo):
;   0 = Immersive VR Dome 150 - Obraz dookola glowy (World-Anchored)
;   1 = Ultra-Szeroka Panorama 180 - Pelne otoczenie VR bez czarnych pasow (obraz dookola 100% pola widzenia)
;   2 = Ekran Kinowy 3D - Plaski ekran wirtualnego kina z czarna ramka
TrackingSubMode=1

; ViewScale (F4 przelacza na zywo: 1.15x, 1.30x, 1.45x, 1.60x, 1.75x, 1.00x):
;   1.45 = naturalna ludzka skala swiata w VR, caly HUD na wprost
ViewScale=1.45

WorldScale=1.0
StereoStrength=1.0

; Parametry przesuniecia stereo (podkrecona wyrazna i gleboka stereoskopia 3D):
StereoBaseShift=0.0110
StereoDepthScale=0.0220
StereoMaxDisparity=0.038
DistanceM=2.0
WidthM=2.1
ForceWindowedReset=0

[Input]
EnableVRGamepad=1
RemapPhysicalPorts=1

; HeadLookMode (F3 przelacza na zywo):
;   1 = Mysz 1:1 (mouse_event - natychmiastowy, plynny obrot kamery w grze ruchem glowy)
;   2 = Prawy Stick Pad (wstrzykiwanie predkosci obrotu glowy do XInput Right Stick)
;   3 = Hybrydowy (Mysz + Stick)
;   0 = Wylaczone (reczny obrot padem/myszka)
HeadLookMode=1
; HeadLookInvertYaw: 1 = obrot w lewo kreci w lewo (F2 przelacza na zywo)
HeadLookInvertYaw=1
HeadLookInvertPitch=0
HeadLookSensitivityYaw=750.0
HeadLookSensitivityPitch=600.0
