[Render]
TestMode=0
; SubmitMode:
;   0 = VR_STEREO_3D (Metoda 2: Sprawdzone stereoskopowe 3D z poprawna polaryzacja lewe/prawe oko)
;   1 = VR_STEREO_SWAP (Odwrocona polaryzacja oczu)
;   2 = QUAD_WORLD_ANCHOR (Kotwiczony w pokoju klasyczny ekran kinowy)
;   3 = QUAD_HEAD_LOCKED (Ekran kinowy podazajacy za glowa)
SubmitMode=0

; TrackingSubMode (F9 przelacza na zywo):
;   0 = Immersive VR Dome 150 - Obraz dookola glowy + sledzenie obrotu glowy w pokoju (World-Anchored)
;   1 = Ultra-Szeroka Panorama 180 - Pelne otoczenie VR bez czarnych pasow (obraz dookola 100% pola widzenia)
;   2 = Ekran Kinowy 3D - Plaski ekran wirtualnego kina z czarna ramka
TrackingSubMode=1

WorldScale=1.0
StereoStrength=1.0
; Parametry przesuniecia stereo (Metoda 2 - sprawdzone i dopasowane):
StereoBaseShift=0.0035
StereoDepthScale=0.0105
StereoMaxDisparity=0.020
DistanceM=2.0
WidthM=2.1
ForceWindowedReset=0

[Input]
EnableVRGamepad=1
RemapPhysicalPorts=1
