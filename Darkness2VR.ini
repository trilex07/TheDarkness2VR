[Render]
TestMode=0
; SubmitMode: 0 = VR_STEREO_3D (True Stereoscopic 3D VR + 6DoF), 1 = VR_STEREO_SWAP (True Stereoscopic 3D with Swapped Eyes), 2 = QUAD_WORLD_ANCHOR (Cinema), 3 = QUAD_HEAD_LOCKED
SubmitMode=0
; TrackingSubMode: 0 = 6DoF + Native Game FOV, 1 = 6DoF + OpenXR FOV, 2 = 3DoF + Native Game FOV
TrackingSubMode=0
WorldScale=1.0
StereoStrength=1.0
; --- Same-frame depth-warp stereo (both eyes from ONE frame, no AFR desync) ---
; Depth source: scene-pass depth captured before the engine clears it (INTZ, verified).
; Calibrated from real gameplay depth (d range 0.93..1.0, mean 0.98):
;   disp@1920: d=0.93 -> ~40px, d=0.98 -> ~12px, d=1.0 (far) -> 0.
; StereoSeparation: per-eye separation K. Higher = stronger 3D depth.
;   0.08 = subtle, 0.15 = default (clear depth), 0.30+ = strong. (F6 adjusts live)
StereoSeparation=0.15
; StereoMaxDisparity: hard per-pixel disparity clamp in UV (fraction of screen width).
;   Caps full disparity at ~2x this value * width: 0.015 -> ~58px at 1920, which keeps
;   near geometry below the fusion limit (no double vision). (F5 adjusts live)
StereoMaxDisparity=0.015
DistanceM=2.0
WidthM=2.1
ForceWindowedReset=0
StereoDup=0

[Input]
EnableVRGamepad=1
RemapPhysicalPorts=1
