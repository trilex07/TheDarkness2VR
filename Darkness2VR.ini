[Render]
; Opt-in bounded worker logging after device creation; startup stays synchronous.
; NIS same-resolution sharpening: 0=off, 2=sharpen, 3=upscale.
NisMode=2
NisSharpness=0.80
AsyncLog=0
; Enable tracking automatically; Ctrl+F8 toggles, L3+R3 recentres.
HeadGeometry=1
; Bypass known final DOF/ghost blur blend in native stereo; restart after changes.
DisableDepthOfField=1
; Opt-in A/B: remove only height-fog blend in verified PS33DE98C1. Restart to change.
; Does not repair missing geometry; bloom, grading, depth and stereo stay unchanged.
DisableCompositeHeightFog=0
; Exact stock FXAA bypass: sharper edges, more visible aliasing. Restart to change.
DisableFXAA=1
; Preserve native clipping for scaled HUD widgets (hides parked placeholders).
ClipScaledUI=1
TextureAnisotropy=16
TestMode=0
; SubmitMode (F10 przelacza na zywo):
;   1 = VR_STEREO_SWAP    (sprawdzony, plynny tryb VR z polaryzacja potwierdzona w testach) [DOMYSLNE]
;   4 = VR_NATIVE_STEREO  (eksperymentalne PRAWDZIWE stereo geometryczne - podwojny render)
;   0 = VR_STEREO_3D      (tryb VR z normalna polaryzacja)
;   2 = QUAD_WORLD_ANCHOR (ekran kinowy zakotwiczony w pokoju)
;   3 = QUAD_HEAD_LOCKED  (ekran kinowy podazajacy za glowa)
SubmitMode=4
; Research (branch research/evolution-engine-render-pipeline):
; RenderPipelineTrace=1 writes %LOCALAPPDATA%\Darkness2VR\render_pipeline_trace.csv
; FrameBoundaryPolicy: 0=PresentPrimary 1=LegacyRc20b 2=TraceOnly (default 2 — no EndScene XR flood)
; RenderPipelineTrace=1
; FrameBoundaryPolicy=2

; StereoMode (tylko SubmitMode 4):
;   1 = pelne stereo dwoch oczu (oko 0 = render zywy, oko 1 = powtorzony strumien klatki)
;   2 = walidacja: replay bez przesuniecia (oba oczy musza byc identyczne)
;   0 = wylaczone (mono)
StereoMode=1
; StereoShiftMode:
;   0 = translacja (clip.x += Px*dx) - POPRAWNE dla VR, dysparycja ~1/w, zero przy nieskonczonosci
;   1 = shear HelixMod (x += sep*(w-conv)) - zero dysparycji przy plaszczyznie zbieznosci
StereoShiftMode=0
; IPD w niekalibrowanych jednostkach gry; 0.065 to wartosc diagnostyczna, nie zweryfikowane metry.
StereoIPD=0.065
ViewOffsetX=0.0
StateBlockHook=0
RenderWidth=3076
RenderHeight=3140
; Protected native engine sizing: 0=off, 1=native window, 2=1.125x, 3=1.25x,
; 4=exact RenderWidth/RenderHeight (requires diagnostic protected sizing build).
; Exact 2676x2728 is a native-resolution target, not a performance improvement.
SourceQuality=0
ZeroCopy=1
; Opt-in CPU A/B: retain one COM ref per exact resource pointer per recorded frame.
; Does not skip rendering, reuse shaders across frames, or remove synchronization.
UniqueReplayResourceRefs=0
; Experimental CPU copy path <=192 bytes; startup guard probe and legacy failure fallback.
; Microbenchmark only: in-game performance/stability not verified. Restart to change.
SmallRecordCopy=0
; Syscall-free recorder copy for in-range VS/PS constant setter payloads the native
; call reads anyway; faults keep the legacy copy. Runtime A/B pending. Restart to change.
ConsumedRecordCopy=0
; Adjacent replay constant uploads only; OFF until controlled in-game A/B.
ReplayConstantBatch=0
; Independent replay scalar-state filtering; runtime acceptance pending.
ReplayStateFilter=0
; Independent replay resource/shader binding filtering; runtime acceptance pending.
ReplayBindingFilter=0
; Dynamic VB/IB replicas; OFF after reported runtime CPU/hang regression. Restart required.
ReplayBufferVersions=0
; Independent float-only write-window experiment; keep 0 for adjacent packet A/B.
ReplayConstantWindow=0
; Extend float windows across texture/TSS/sampler bindings only; opt-in, same draw barriers.
ReplayConstantBindWindow=0
; Exact final replay-eye float packets; independent runtime candidate, OFF.
; Native float submission deduplication: independent candidate, OFF pending combined PSVR2 validation.
NativeSubmissionFilter=0
ReplayConstantReuse=0
; Exact installed native builders' active local buffers only; SHA/ABI admission, otherwise legacy copy.
NativeOwnedConstantCopy=0
; Extend admitted capture to exact fixed fields of the current native material owner.
NativeOwnedMaterialCopy=0
; Protected diagnostic build: 0=OFF, up to512 never-issued occlusion queries.
; Created at startup/successful Reset; one transfer per exact native owner call.
QueryPreloadCount=0
; 1=one startup creation per exact shader; 2=two independent owned references.
StartupShaderCopies=1
; Reuse the frame-start ALL state-block object, refreshing its contents each frame.
ReuseStateSnapshots=0
; Startup-only: return the worker context after submission, fence GPU reads at
; shared-input reuse/Reset. Requires StereoTransferWorker=1 or3 and LastConsumerReaderFence=1.
; StereoTransferWorker startup modes:0=serial/native D3D9 flags,1=D3D9/11 worker
; (adds MULTITHREADED),2=serial MT control,3=D3D11-only worker/native flags.
; Mode3 waits for the D3D9 producer on its owner before handoff. Experimental;
; trades producer/replay overlap for avoiding added locking on all D3D9 calls.
; Experimental; no measured in-game FPS gain yet.
DeferStereoTransferReader=0
; Mnoznik FOV renderowania na tan(FOV/2) - bazowy; AutoFovWiden=1 wylicza pokrycie z HMD
FovWiden=1.0
; Polaryzacja oczu: 0 = lewe oko +shift, 1 = zamienione
StereoPolarity=0
; Automatyczne pokrycie frustumu HMD (1 = pelne pokrycie; <1 cofa krawedzie od peryferiow soczewek)
AutoFovWiden=1
AutoFovCoverage=1.0
; Render szerzej niz HMD, zeby kompozytor przycial obwodowy pas (nieokreslone oswietlenie
; deferred poza natywnym frustum) - 0.08 = 8% zapasu
EdgeCrop=0.08
LockHeadPosition=1
LockRadiusM=0.5
; Korekta oswietlenia/rekonstrukcji: bit 1 = nazwane VS/STP, bit 2 = kompensacja PS (InverseProjection + ViewExtents)
ProjectionFix=3
; Skalowanie tresci 2D (menu/HUD) z FOV bez przesuniecia miedzyocznego
Scale2DContent=1
; Nadrzedny FOV silnika w stopniach (0 = wylaczony; sciezka eksperymentalna, ryzyko crashy)
FovOverride=0
DumpFrames=0
DumpDelay=300
; Parametry dla trybu shear (StereoShiftMode=1):
StereoSep=0.020
StereoConv=2.0
; FOV gry w stopniach (pelny kat) - uzywany do projekcji OpenXR per-oko
GameFovX=73.2
GameFovY=44.9

; --- Stara metoda (SubmitMode 0/1) ---
TrackingSubMode=1
ViewScale=1.45
WorldScale=1.0
StereoStrength=1.0
StereoBaseShift=0.0110
StereoDepthScale=0.0220
StereoMaxDisparity=0.038
DistanceM=2.0
WidthM=2.1
ForceWindowedReset=0

[Input]
; Independent OpenXR grip vibration + optional PSVR2 Toolkit trigger bridge.
; 0 stops both. The x64 helper is private, not a SteamVR configuration change.
AdaptiveTriggers=1
; Native hooks are enabled only by the preserved-config test candidate.
NativeLeftAim=0
NativeWeaponPose=0
NativeTrackedHands=0
; Controller aim contribution to throw direction (0 = physical swing only).
ThrowAimAssist=20
; RC3: grip/gestures -> stock-game tentacle actions (models/aim are not hand-tracked).
TentacleGestureBridge=1
TentacleAimMarker=1
GestureGamepadBridge=0
EnableVRGamepad=1
; VR Settings compositor panel toggle: Windows virtual-key code (45 = INSERT).
; 0 disables the binding. AUTO/HALF explicitly report unsupported until a
; documented runtime pacing adapter is available; they never force half FPS.
VRSettingsKey=45
RemapPhysicalPorts=1

; HeadLookMode (F3 przelacza na zywo):
;   1 = Mysz 1:1 (mouse_event - natychmiastowy, plynnny obrot kamery w grze ruchem glowy)
;   2 = Prawy Stick Pad (wstrzykiwanie predkosci obrotu glowy do XInput Right Stick)
;   3 = Hybrydowy (Mysz + Stick)
;   0 = Wylaczone (reczny obrot padem/myszka)
HeadLookMode=1
; HeadLookInvertYaw: 1 = obrot w lewo kreci w lewo (F2 przelacza na zywo)
HeadLookInvertYaw=1
HeadLookInvertPitch=0
HeadLookSensitivityYaw=750.0
HeadLookSensitivityPitch=600.0
