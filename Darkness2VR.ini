[Render]
TestMode=0
; SubmitMode (F10 przelacza na zywo):
;   4 = VR_NATIVE_STEREO  (PRAWDZIWE stereo geometryczne - podwojny render w jednej klatce) [DOMYSLNE]
;   0 = VR_STEREO_3D      (stara metoda: przesuniecie obrazu 2D)
;   1 = VR_STEREO_SWAP    (stara metoda, odwrocona polaryzacja)
;   2 = QUAD_WORLD_ANCHOR (ekran kinowy zakotwiczony w pokoju)
;   3 = QUAD_HEAD_LOCKED  (ekran kinowy podazajacy za glowa)
SubmitMode=4

; StereoMode (tylko SubmitMode 4):
;   1 = pelne stereo dwoch oczu (oko 0 = render zywy, oko 1 = powtorzony strumien klatki)
;   2 = walidacja: replay bez przesuniecia (oba oczy musza byc identyczne)
;   0 = wylaczone (mono)
StereoMode=1
; StereoShiftMode:
;   0 = translacja (clip.x += Px*dx) - POPRAWNE dla VR, dysparycja ~1/w, zero przy nieskonczonosci
;   1 = shear HelixMod (x += sep*(w-conv)) - zero dysparycji przy plaszczyznie zbieznosci
StereoShiftMode=0
; IPD pelne w jednostkach swiata (0.065 = naturalne 65mm) - F6 cykluje
StereoIPD=0.065
; Mnoznik FOV renderowania na tan(FOV/2): 2.5 = pion 45 -> ~93 deg (pokrywa gory/dol) - F11 cykluje
FovWiden=2.5
; Polaryzacja oczu: 0 = lewe oko +shift, 1 = zamienione
StereoPolarity=0
; Parametry dla trybu shear (StereoShiftMode=1):
StereoSep=0.020
StereoConv=2.0
; FOV gry w stopniach (pelny kat) - uzywany do projekcji OpenXR per-oko
GameFovX=73.2
GameFovY=44.9

; --- Stara metoda (SubmitMode 0/1) ---
TrackingSubMode=1
ViewScale=1.45
WorldScale=1.0
StereoStrength=1.0
StereoBaseShift=0.0110
StereoDepthScale=0.0220
StereoMaxDisparity=0.038
DistanceM=2.0
WidthM=2.1
ForceWindowedReset=0

[Input]
EnableVRGamepad=1
RemapPhysicalPorts=1

; HeadLookMode (F3 przelacza na zywo):
;   1 = Mysz 1:1 (mouse_event - natychmiastowy, plynnny obrot kamery w grze ruchem glowy)
;   2 = Prawy Stick Pad (wstrzykiwanie predkosci obrotu glowy do XInput Right Stick)
;   3 = Hybrydowy (Mysz + Stick)
;   0 = Wylaczone (reczny obrot padem/myszka)
HeadLookMode=1
; HeadLookInvertYaw: 1 = obrot w lewo kreci w lewo (F2 przelacza na zywo)
HeadLookInvertYaw=1
HeadLookInvertPitch=0
HeadLookSensitivityYaw=750.0
HeadLookSensitivityPitch=600.0
